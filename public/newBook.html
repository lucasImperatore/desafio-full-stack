<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>add new book</title>
  </head>
  <body>
    <h1>Adicione seu novo livro</h1>
    <form action="/arquive" method="POST">
      <div id="bookName">
        <label>Nome do livro</label>
        <input type="text" name="book_name" id="book_name" placeholder="Eragon" required/>
      </div>

      <div id="authorsName">
        <label>Nome do Autor</label>
        <input
      type="text" name="author_name" id="author_name" placeholder="Christopher Paolini" required/>
      </div>

      <div id="Ean">
        <label>EAN</label>
        <input type="number" name="ean" id="ean" placeholder="7892024532048" />
      </div>

      <div id="scoreValue">
        <label>Nota</label>
        <input type="number" name="score" id="" placeholder="8" />
      </div>
      
      <div id="stats">
        <p>Status</p>

        <input type="radio" id="reading" name="stats" value="lendo" />
        <label for="reading">Lendo</label>

        <input type="radio" id="read" name="stats" value="lido" />
        <label for="read">Lido</label>

        <input type="radio" id="droped" name="stats" value="abandonado" />
        <label for="droped">Abandonado</label>
      </div>

      <button type="submit" onclick="goBack()">Cadastrar</button>
    </form>
    <div>
    <button onclick="goHome()">HOME</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
